name: VoiceOver

on:
  pull_request:
    paths:
      - "public/**"
      - "test/screen-reader/**"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to test
        required: true
        default: main

permissions:
  contents: read

jobs:
  voiceover:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - run: bun install --frozen-lockfile
      - run: npx @guidepup/setup setup --ci
      - run: npx @guidepup/setup install
      - run: bun x playwright install webkit
      - run: bun x playwright test -c test/screen-reader
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spoken-phrase-log
          path: test-results/**/spoken-phrase-log.json
          if-no-files-found: warn
