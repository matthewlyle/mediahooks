name: VoiceOver

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to test
        required: true
        default: main

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      ui: ${{ steps.changes.outputs.ui }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 2
      # voiceover is a required check: skip the job here, never filter the trigger with paths:
      - id: changes
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo ui=true >> "$GITHUB_OUTPUT"
          elif ! echo "$LABELS" | jq -e 'index("skip: voiceover")' > /dev/null &&
            git diff --name-only HEAD^1 HEAD | grep -v '\.test\.ts$' |
              grep -qE '^(public/|src/|test/screen-reader/|package\.json$|bun\.lock$|\.github/workflows/voiceover\.yml$)'; then
            echo ui=true >> "$GITHUB_OUTPUT"
          fi

  voiceover:
    needs: changes
    if: needs.changes.outputs.ui
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - run: bun install --frozen-lockfile
      - name: Set up VoiceOver
        run: |
          for attempt in 1 2 3; do
            npx @guidepup/setup setup --ci && npx @guidepup/setup install && exit 0
            echo "VoiceOver setup failed (attempt $attempt)"; sleep 15
          done
          exit 1
      - run: bun x playwright install webkit
      - run: bun x playwright test -c test/screen-reader
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spoken-phrase-log
          path: test-results/**/spoken-phrase-log.json
          if-no-files-found: warn
