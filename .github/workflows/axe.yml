name: axe

on:
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to test
        required: true
        default: main

permissions:
  contents: read

jobs:
  axe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 2
      # axe is a required check: skip steps here, never filter the trigger with paths:
      - id: changes
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ] ||
            git diff --name-only HEAD^1 HEAD | grep -v '\.test\.ts$' |
              grep -qE '^(public/|src/|test/axe/|package\.json$|bun\.lock$|\.github/workflows/axe\.yml$)'; then
            echo ui=true >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.ui
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - if: steps.changes.outputs.ui
        run: bun install --frozen-lockfile
      - if: steps.changes.outputs.ui
        run: bun x playwright install --with-deps chromium
      - if: steps.changes.outputs.ui
        run: bun x playwright test -c test/axe
