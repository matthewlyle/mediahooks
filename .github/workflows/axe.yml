name: axe

on:
  pull_request:
    paths:
      - "public/**"
      - "src/app.ts"
      - "test/axe/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/axe.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to test
        required: true
        default: main

permissions:
  contents: read

jobs:
  axe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - run: bun install --frozen-lockfile
      - run: bun x playwright install --with-deps chromium
      - run: bun x playwright test -c test/axe
