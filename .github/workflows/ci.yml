name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: mediahooks:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name mediahooks -p 8787:8787 mediahooks:ci
          for _ in $(seq 30); do curl -fs localhost:8787/healthz && break; sleep 1; done
          curl -fs localhost:8787/healthz
          html=$(curl -fs localhost:8787/)
          assets=$(grep -oE '(src|href)="/[^"]+"' <<<"$html" | cut -d'"' -f2)
          grep -q '\.js$' <<<"$assets"
          for a in $assets; do curl -fso /dev/null "localhost:8787$a" || { echo "missing $a"; exit 1; }; done
      - if: failure()
        run: docker logs mediahooks

  axe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - run: bun install --frozen-lockfile
      - run: bun x playwright install --with-deps chromium
      - run: bun x playwright test -c test/axe
